# Mau nginx dung truoc Tomcat (Tomcat chay cong 8080). Bat JLEARN_SECURITY_TRUSTPROXY=true chi khi di qua nginx nay.
limit_req_zone $binary_remote_addr zone=jl_auth:10m rate=10r/m;

upstream jlearn_app { server 127.0.0.1:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;                       # khop maxRequestSize cua ProfileServlet

    location /jlearn/assets/ { proxy_pass http://jlearn_app; expires 7d; }
    location = /jlearn/login    { limit_req zone=jl_auth burst=10 nodelay; proxy_pass http://jlearn_app; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /jlearn/register { limit_req zone=jl_auth burst=5  nodelay; proxy_pass http://jlearn_app; proxy_set_header X-Forwarded-For $remote_addr; }
    location /jlearn/ {
        proxy_pass http://jlearn_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi de, khong noi them, de client khong gia mao IP
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
