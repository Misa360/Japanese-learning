# Cau hinh mac dinh. Moi khoa co the ghi de bang bien moi truong JLEARN_<KHOA_VIET_HOA_THAY_DAU_CHAM_BANG_GACH_DUOI>
# vi du db.url -> JLEARN_DB_URL, security.bcrypt.cost -> JLEARN_SECURITY_BCRYPT_COST. KHONG commit mat khau that vao file nay.
db.url=jdbc:mysql://localhost:3306/nihongo_app?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
db.user=root
db.password=
db.pool=10

# Thu muc luu anh dai dien (ngoai webapp). De trong = <catalina.base>/jlearn-storage/uploads, neu khong co thi ./storage/uploads
upload.dir=

# Phia sau nginx/load balancer: bat de lay IP that tu X-Forwarded-For (CHI bat khi co proxy tin cay)
security.trustProxy=false
security.bcrypt.cost=12
security.login.maxFailures=5
security.login.windowMinutes=15
security.login.ipMaxFailures=30
# Gioi han tan suat theo IP (bo nho cua tung node): so lan / so giay
ratelimit.register.max=5
ratelimit.register.windowSeconds=3600
ratelimit.login.max=60
ratelimit.login.windowSeconds=600
